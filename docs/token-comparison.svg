<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a317"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="hermes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a2e2e"/>
      <stop offset="1" stop-color="#c14545"/>
    </linearGradient>
  </defs>

  <rect width="820" height="420" rx="14" fill="#0f1115"/>

  <!-- title -->
  <text x="40" y="52" fill="#f4f4f5" font-size="24" font-weight="700">Tokens sent per turn</text>
  <text x="40" y="78" fill="#9aa0a6" font-size="14">same model (openrouter/owl-alpha), same coding tasks · from OpenRouter request logs</text>

  <!-- scale baseline -->
  <line x1="210" y1="120" x2="210" y2="300" stroke="#2a2d34" stroke-width="1"/>

  <!-- Hermes bar (≈144k of a 150k scale) -->
  <text x="190" y="172" fill="#e8a8a8" font-size="15" text-anchor="end" font-weight="600">Hermes Agent</text>
  <rect x="210" y="150" width="560" height="40" rx="6" fill="url(#hermes)"/>
  <text x="760" y="175" fill="#ffffff" font-size="16" text-anchor="end" font-weight="700">~144,000</text>

  <!-- Persoje bar (≈15k → 58px) -->
  <text x="190" y="262" fill="#ffcf6b" font-size="15" text-anchor="end" font-weight="600">Persoje</text>
  <rect x="210" y="240" width="58" height="40" rx="6" fill="url(#amber)"/>
  <text x="280" y="265" fill="#ffcf6b" font-size="16" font-weight="700">~15,000</text>
  <text x="372" y="265" fill="#9aa0a6" font-size="13">(often 1–10k early in a session)</text>

  <!-- scale ticks -->
  <text x="210" y="320" fill="#5b6068" font-size="11" text-anchor="middle">0</text>
  <text x="490" y="320" fill="#5b6068" font-size="11" text-anchor="middle">75k</text>
  <text x="770" y="320" fill="#5b6068" font-size="11" text-anchor="middle">150k</text>

  <!-- callout -->
  <text x="40" y="372" fill="#e8a317" font-size="20" font-weight="700">≈ 10× leaner</text>
  <text x="200" y="372" fill="#f4f4f5" font-size="16">~90% fewer tokens per turn — and Hermes peaked at 288k while Persoje held flat.</text>
  <text x="40" y="398" fill="#5b6068" font-size="12">Hermes replays full history + untruncated tool output every turn. Persoje: goal anchor + recent turns + summary, capped tool results, swap-to-disk transcript.</text>
</svg>
