<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a317"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="hermes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a2e2e"/>
      <stop offset="1" stop-color="#c14545"/>
    </linearGradient>
  </defs>

  <rect width="840" height="430" rx="14" fill="#0f1115"/>

  <text x="40" y="50" fill="#f4f4f5" font-size="23" font-weight="700">Context size per turn</text>
  <text x="40" y="76" fill="#9aa0a6" font-size="13.5">same model, same coding tasks · observed range with median ◆ · Persoje vs a conventional full-replay agent</text>

  <!-- scale 0..290k over x 200..780 -->
  <line x1="200" y1="110" x2="200" y2="300" stroke="#2a2d34" stroke-width="1"/>

  <!-- Hermes range bar 17k..288k, median ~143k -->
  <text x="184" y="166" fill="#e8a8a8" font-size="15" text-anchor="end" font-weight="600">Full-replay agent</text>
  <rect x="234" y="146" width="542" height="36" rx="6" fill="url(#hermes)" opacity="0.85"/>
  <polygon points="486,140 492,150 480,150" fill="#ffd2d2"/>
  <line x1="486" y1="146" x2="486" y2="182" stroke="#ffd2d2" stroke-width="2"/>
  <text x="240" y="170" fill="#ffe6e6" font-size="13">17k</text>
  <text x="770" y="170" fill="#ffffff" font-size="14" text-anchor="end" font-weight="700">288k</text>
  <text x="486" y="132" fill="#ffd2d2" font-size="12" text-anchor="middle">median ~143k</text>

  <!-- Persoje range bar 1k..25k, median ~12k -->
  <text x="184" y="256" fill="#ffcf6b" font-size="15" text-anchor="end" font-weight="600">Persoje</text>
  <rect x="202" y="236" width="48" height="36" rx="6" fill="url(#amber)"/>
  <polygon points="224,230 230,240 218,240" fill="#fff3d6"/>
  <line x1="224" y1="236" x2="224" y2="272" stroke="#fff3d6" stroke-width="2"/>
  <text x="262" y="259" fill="#ffcf6b" font-size="14" font-weight="700">1k – 25k</text>
  <text x="224" y="222" fill="#ffcf6b" font-size="12" text-anchor="middle">median ~12k</text>

  <!-- scale ticks -->
  <text x="200" y="320" fill="#5b6068" font-size="11" text-anchor="middle">0</text>
  <text x="490" y="320" fill="#5b6068" font-size="11" text-anchor="middle">145k</text>
  <text x="780" y="320" fill="#5b6068" font-size="11" text-anchor="middle">290k</text>

  <text x="40" y="372" fill="#e8a317" font-size="20" font-weight="700">≈ 12× leaner per turn</text>
  <text x="232" y="372" fill="#f4f4f5" font-size="15">median ~143k vs ~12k. Persoje's whole range sits below where Hermes even starts.</text>
  <text x="40" y="400" fill="#5b6068" font-size="12">Conventional agents let context grow to ~280k before compacting. Persoje keeps a lean working set: goal anchor + recent turns + summary, capped tool output, swap-to-disk transcript. See bench/ for a reproducible lean-vs-naive measurement.</text>
</svg>
